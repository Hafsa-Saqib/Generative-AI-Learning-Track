services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: ragdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build:
      context: ..
      dockerfile: week4-deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/ragdb
    depends_on:
      - postgres
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    pids_limit: 256

volumes:
  pgdata:
