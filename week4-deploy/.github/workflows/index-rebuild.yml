name: index-rebuild
on:
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pydantic
      - run: pytest week4-deploy/tests/test_deploy.py::test_alias_swaps_only_when_scores_hold_and_rolls_back -q
      - run: python week3-finetune/eval/run_evals.py
